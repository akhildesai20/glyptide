name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build:lib
      - run: npm run generate:ai-docs
      - run: npm run typecheck
      - run: npm test
      - name: Ensure AI docs committed
        run: |
          git add -N site/public
          git diff --exit-code -- site/public/llms.txt site/public/llms-full.txt site/public/registry site/public/schemas site/public/docs site/public/skills
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        working-directory: site
        env:
          CI: true
