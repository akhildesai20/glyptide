name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build:lib
      - run: npm run generate:ai-docs
      - name: Typecheck core
        run: npm run typecheck
      - name: Typecheck React adapter
        run: npm run typecheck -w @glyptide/react
      - name: Typecheck site
        run: npx tsc --noEmit -p site
      - name: Production website build
        run: npm run build
      - name: Unit tests (site + React)
        run: npm test
      - name: Bundle size budgets
        run: npm run size -- --check-budgets
      - name: Clean-room package integration
        run: npm run test:clean-room
      - name: AI docs agent smoke
        run: npm run test:ai-docs
      - name: Ensure AI docs committed
        shell: bash
        run: |
          git add -N site/public
          git diff --exit-code -- site/public/llms.txt site/public/llms-full.txt site/public/registry site/public/schemas site/public/docs site/public/skills
      - name: NodeNext resolution smoke
        shell: bash
        run: |
          node -e "import('glyptide').then(m=>console.log('esm',!!m.createGlyptide))"
          node -e "console.log('cjs',!!require('glyptide').createGlyptide)"
        working-directory: packages/glyptide
      - name: Install Chromium
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npx playwright install --with-deps chromium
      - name: Playwright Chromium
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        working-directory: site
        env:
          CI: true
        run: npx playwright test --project=chromium

  browsers:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build:lib
      - run: npm run generate:ai-docs
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Smoke Chromium + Firefox + WebKit
        working-directory: site
        env:
          CI: true
          GLYPTIDE_E2E_ALL_BROWSERS: "1"
        run: npx playwright test e2e/smoke.spec.ts --project=chromium --project=firefox --project=webkit
