<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playground — Glyptide</title>
    <meta
      name="description"
      content="Configure Glyptide patterns, motion, appearance, and stream behavior. Browse all 96 patterns."
    />
    <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Playground — Glyptide" />
    <meta
      property="og:description"
      content="Configure Glyptide patterns, motion, appearance, and stream behavior."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://glyptide.vercel.app/playground/" />
    <meta property="og:image" content="https://glyptide.vercel.app/og.svg" />
    <!-- PNG OG (1200×630): see docs/BRANDING.md -->
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://glyptide.vercel.app/playground/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("glyptide-theme") || "system";
          var dark =
            t === "dark" ||
            (t === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.dataset.themePref = t;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/site.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div data-site-header></div>

    <main id="main">
      <section
        class="playground-section wrap"
        id="playground"
        aria-labelledby="play-heading"
      ></section>
      <div id="libraryMount"></div>
    </main>

    <div data-site-footer></div>
    <div id="dialogMount"></div>

    <script type="module" src="/src/pages/playground.ts"></script>
  </body>
</html>
